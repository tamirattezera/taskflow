<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TaskFlow — a simple, focused task management application."
    />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>TaskFlow</h1>
      <p>Organize your work, one task at a time.</p>
    </header>

    <main id="main-content">
      <section aria-labelledby="task-form-heading">
        <h2 id="task-form-heading">Add a task</h2>

        <form id="task-form">
          <label for="task-title">Task title</label>
          <input
            id="task-title"
            name="title"
            type="text"
            placeholder="e.g. Learn JavaScript"
            maxlength="120"
            required
          />
          <button type="submit">Add task</button>
        </form>
      </section>

      <section aria-labelledby="task-list-heading">
        <h2 id="task-list-heading">My Tasks</h2>

        <nav aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">
            All
          </button>

          <button type="button" data-filter="active" aria-pressed="false">
            Active
          </button>

          <button type="button" data-filter="completed" aria-pressed="false">
            Completed
          </button>
        </nav>

        <ul id="task-list" aria-live="polite">
          <li id="empty-state">No tasks yet. Add your first task above.</li>
        </ul>
      </section>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
